<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Geston MD Mini</title><style>body{font-family:system-ui;background:#0b1020;color:#fff;margin:0;padding:24px}main{max-width:620px;margin:auto}.card{background:#141b31;border:1px solid #26304d;border-radius:18px;padding:22px;margin:14px 0}input,button{width:100%;box-sizing:border-box;padding:14px;border-radius:12px;border:1px solid #34405f;background:#0d1428;color:#fff;margin-top:10px}button{background:#1f7aff;border:0;font-weight:700;cursor:pointer}.code{font-size:32px;letter-spacing:5px;text-align:center;padding:20px;background:#080d1c;border-radius:14px;margin-top:16px}.muted{color:#aab4cf}.ok{color:#62e6a6}</style></head><body><main><div class="card"><h1>🤖 Geston MD Mini</h1><p class="muted">Connecte ton WhatsApp au bot sans copier de SESSION ID.</p><label>Numéro WhatsApp</label><input id="phone" placeholder="243XXXXXXXXX" inputmode="numeric"><label>Code parrainage (facultatif)</label><input id="ref" placeholder="Ex. ABC123"><button id="go">Générer le code</button><div id="out"></div></div><div class="card"><h2>🎁 Parrainage</h2><p class="muted">Crée ton lien et partage-le.</p><button id="refbtn">Créer mon lien</button><div id="refout"></div></div></main><script>const q=new URLSearchParams(location.search);document.getElementById('ref').value=q.get('ref')||'';let timer;document.getElementById('go').onclick=async()=>{const out=document.getElementById('out');out.innerHTML='<p>Préparation…</p>';const r=await fetch('/api/pair',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({phone:document.getElementById('phone').value,ref:document.getElementById('ref').value})});const d=await r.json();if(!r.ok){out.innerHTML='<p>'+d.error+'</p>';return}out.innerHTML='<p>Demande créée. Attends le code…</p><div id="code"></div>';clearInterval(timer);timer=setInterval(async()=>{const s=await fetch('/api/status/'+d.id).then(x=>x.json());if(s.code)document.getElementById('code').innerHTML='<div class="code">'+s.code+'</div><p>Dans WhatsApp : Appareils connectés → Connecter un appareil → utiliser le code.</p>';if(s.status==='connected'){document.getElementById('code').innerHTML+='<p class="ok">✅ WhatsApp connecté à Geston MD Mini.</p>';clearInterval(timer)}if(s.error){document.getElementById('code').innerHTML+='<p>'+s.error+'</p>';clearInterval(timer)}},1500)};document.getElementById('refbtn').onclick=async()=>{const d=await fetch('/api/referral',{method:'POST',headers:{'content-type':'application/json'},body:'{}'}).then(r=>r.json());document.getElementById('refout').innerHTML='<p><b>'+d.code+'</b></p><input value="'+d.url+'" readonly><p>Parrainages confirmés : 0</p>'}</script></body></html>
